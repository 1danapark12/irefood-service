<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카카오맵 API 데모</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #map { width: 100%; height: 100vh; }
  #notice {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: #fff; padding: 8px 12px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-size: 13px; max-width: 320px;
  }
</style>
</head>
<body>

<div id="notice">
  ✅ appkey 적용됨. <b>www.irefood.com</b> 도메인이 카카오 개발자사이트에
  등록되어 있어야 지도가 표시됩니다. (다른 도메인에서 열면 오류가 납니다)
</div>
<div id="map"></div>

<!-- ↓↓↓ YOUR_APP_KEY 부분을 카카오 개발자사이트에서 발급받은 JavaScript 키로 교체하세요 ↓↓↓ -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=84c40287426ed1f4fbbbaa04e4d73a54"></script>
<script>
  var container = document.getElementById('map');
  var options = {
    center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 시청 기준
    level: 4
  };
  var map = new kakao.maps.Map(container, options);

  // 예시 마커
  var marker = new kakao.maps.Marker({
    position: options.center
  });
  marker.setMap(map);
</script>

</body>
</html>
